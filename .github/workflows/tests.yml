name: tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install a CPU-only torch, then the rest
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/ -q

  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt
      - name: The command the README opens with
        run: python scripts/recommend.py --category Video_Games --epochs 3
      - name: A short pass over the whole pipeline
        run: |
          python scripts/evaluate.py --category Video_Games \
            --max-users 3000 --eval-users 200 --candidates 20 \
            --lightgcn-epochs 3 --bert-epochs 1 --negatives 64 \
            --bert-batch 128 --workers 0 \
            --out /tmp/smoke.json
      - name: Export the serving artifacts from a small run
        run: |
          python scripts/export_serving.py --category Video_Games \
            --max-users 3000 --lightgcn-epochs 3 --bert-epochs 1 \
            --negatives 64 --bert-batch 128 --workers 0 \
            --out serving_artifacts/Video_Games
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts
          path: serving_artifacts/Video_Games
          retention-days: 3

  docker:
    runs-on: ubuntu-latest
    needs: end-to-end
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: smoke-artifacts
          path: serving_artifacts/Video_Games
      - name: Build the API image with the smoke artifacts baked in
        run: |
          docker build -t recsys-api \
            --build-arg ARTIFACTS=serving_artifacts/Video_Games .
      - name: The container answers /health and /recommend
        run: |
          docker run -d --name api -p 8000:8000 recsys-api
          for i in $(seq 30); do
            curl -sf localhost:8000/health && break || sleep 1
          done
          curl -sf -X POST localhost:8000/recommend \
            -H 'content-type: application/json' \
            -d '{"user_id": 0, "k": 5}' | tee /tmp/out.json
          python -c "import json; r=json.load(open('/tmp/out.json')); assert len(r['items']) == 5, r"
      - if: failure()
        run: docker logs api
