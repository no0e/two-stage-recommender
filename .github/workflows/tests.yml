name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    env:
      # Some BLAS builds deadlock on the item-item inverse. Pinning the thread
      # count costs nothing here and makes the run deterministic.
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install a CPU-only torch
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - run: python -m pytest tests/ -q

  end-to-end:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - run: python scripts/fetch_data.py
      - name: The command the README opens with
        run: python scripts/recommend.py
      - name: A short pass over the whole pipeline
        run: python scripts/evaluate.py --lightgcn-epochs 5 --bert-epochs 1
